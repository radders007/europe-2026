<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Europe 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Outfit:wght@300;400;500;600&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0a0a0f;
  --s1:#111118;
  --s2:#18181f;
  --s3:#22222c;
  --border:#2c2c38;
  --text:#ddd8cf;
  --muted:#6a6575;
  --dim:#42404d;
  --accent:#e8a44a;
  --green:#6db88a;
  --blue:#7aafd4;
  --red:#d47a7a;
  --violet:#a07dd4;
  --white:#f2ede4;
  --accent-glow:rgba(232,164,74,0.12);
}
html,body{height:100%;overflow:hidden;-webkit-text-size-adjust:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Outfit',sans-serif;
  display:flex;flex-direction:column;
  max-width:480px;margin:0 auto;
  position:relative;
}

/* ── TOPBAR ── */
.topbar{
  background:var(--s1);
  border-bottom:1px solid var(--border);
  padding:1rem 1rem 0.8rem;
  flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  position:relative;
  overflow:hidden;
}
.topbar::after{
  content:'';
  position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  opacity:0.4;
}
.topbar-left{}
.wordmark{
  font-family:'Libre Baskerville',serif;
  font-size:1.15rem;
  font-weight:400;
  color:var(--white);
  letter-spacing:0.01em;
  line-height:1;
}
.wordmark em{font-style:italic;color:var(--accent);}
.topbar-sub{
  font-family:'DM Mono',monospace;
  font-size:0.56rem;
  letter-spacing:0.14em;
  color:var(--muted);
  margin-top:0.3rem;
  text-transform:uppercase;
}
.today-btn{
  background:transparent;
  color:var(--accent);
  border:1px solid rgba(232,164,74,0.4);
  border-radius:20px;
  padding:0.35rem 0.85rem;
  font-family:'Outfit',sans-serif;
  font-size:0.7rem;
  font-weight:500;
  cursor:pointer;
  letter-spacing:0.04em;
  transition:all 0.2s;
  flex-shrink:0;
}
.today-btn:hover{background:var(--accent-glow);border-color:var(--accent);}

/* ── VIEWS ── */
.view{display:none;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.view.active{display:flex;flex-direction:column;}
.view::-webkit-scrollbar{width:0;}

/* ── BOTTOM NAV ── */
.bottomnav{
  background:var(--s1);
  border-top:1px solid var(--border);
  display:flex;flex-shrink:0;
  position:relative;
}
.bottomnav::before{
  content:'';
  position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  opacity:0.25;
}
.nav-btn{
  flex:1;background:none;border:none;
  padding:0.7rem 0.25rem 0.55rem;
  display:flex;flex-direction:column;align-items:center;gap:0.18rem;
  cursor:pointer;color:var(--dim);
  transition:color 0.15s;font-family:'Outfit',sans-serif;
}
.nav-btn.active{color:var(--accent);}
.nav-icon{font-size:1.1rem;line-height:1;}
.nav-label{font-size:0.56rem;letter-spacing:0.08em;text-transform:uppercase;font-weight:500;}
.nav-btn.active .nav-label{color:var(--accent);}

/* ══ TRIP VIEW ══ */
#tripView{padding:0;}
.trip-cities{
  background:var(--s1);
  border-bottom:1px solid var(--border);
  padding:0.65rem 0.75rem;
  flex-shrink:0;
}
.trip-cities-label{
  font-family:'DM Mono',monospace;font-size:0.55rem;
  letter-spacing:0.13em;color:var(--muted);text-transform:uppercase;
  margin-bottom:0.45rem;
}
.city-scroller{
  display:flex;gap:0.4rem;
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.city-scroller::-webkit-scrollbar{display:none;}
.city-pill{
  background:var(--s2);border:1px solid var(--border);
  border-radius:20px;padding:0.3rem 0.75rem;
  font-size:0.68rem;font-weight:500;color:var(--muted);
  cursor:pointer;white-space:nowrap;flex-shrink:0;
  transition:all 0.15s;font-family:'Outfit',sans-serif;
}
.city-pill.active{background:var(--accent-glow);border-color:rgba(232,164,74,0.5);color:var(--accent);}

.timeline{padding:0.75rem 0.75rem 1.5rem;}

.seg-block{margin-bottom:0.25rem;}
.seg-banner{
  display:flex;align-items:stretch;gap:0;
  margin-bottom:0.5rem;margin-top:1rem;
}
.seg-banner-line{width:2px;background:var(--accent);border-radius:2px;flex-shrink:0;opacity:0.6;}
.seg-banner-body{
  flex:1;padding:0.6rem 0.85rem;
  background:linear-gradient(135deg,rgba(232,164,74,0.06),transparent);
  border:1px solid rgba(232,164,74,0.15);
  border-left:none;border-radius:0 8px 8px 0;
}
.seg-city{
  font-family:'Libre Baskerville',serif;
  font-size:1.05rem;font-weight:400;font-style:italic;
  color:var(--accent);line-height:1;
}
.seg-meta{
  font-family:'DM Mono',monospace;font-size:0.58rem;
  letter-spacing:0.07em;color:var(--muted);margin-top:0.25rem;
}

.day-group{margin-bottom:0.25rem;}
.day-label{
  font-family:'DM Mono',monospace;font-size:0.58rem;
  letter-spacing:0.1em;color:var(--muted);text-transform:uppercase;
  padding:0.5rem 0 0.3rem 2.4rem;
}
.day-label.is-today{color:var(--accent);font-weight:400;}

.tl-row{display:flex;gap:0;margin-bottom:0.25rem;cursor:pointer;}
.tl-spine{
  width:2.4rem;flex-shrink:0;
  display:flex;flex-direction:column;align-items:center;
}
.tl-dot{
  width:9px;height:9px;border-radius:50%;
  background:var(--border);border:2px solid var(--s1);
  flex-shrink:0;margin-top:0.35rem;z-index:1;
  transition:transform 0.15s;
}
.tl-row:hover .tl-dot{transform:scale(1.3);}
.tl-dot.hotel{background:var(--blue);}
.tl-dot.transport{background:var(--accent);}
.tl-dot.food{background:var(--green);}
.tl-dot.car{background:var(--violet);}
.tl-dot.ferry{background:var(--blue);}
.tl-dot.is-today{box-shadow:0 0 0 3px rgba(232,164,74,0.25);}
.tl-line{width:1px;flex:1;background:var(--border);margin:0 auto;}

.tl-card{
  flex:1;
  background:var(--s2);border:1px solid var(--border);
  border-radius:8px;padding:0.55rem 0.75rem;
  transition:border-color 0.15s;
  margin-bottom:0.1rem;
}
.tl-row:hover .tl-card{border-color:rgba(232,164,74,0.3);}
.tl-time{
  font-family:'DM Mono',monospace;font-size:0.58rem;
  color:var(--accent);margin-bottom:0.1rem;letter-spacing:0.04em;
}
.tl-title{font-size:0.78rem;font-weight:500;color:var(--white);line-height:1.3;}
.tl-detail{font-size:0.68rem;color:var(--muted);margin-top:0.12rem;line-height:1.45;}
.tl-conf{
  font-family:'DM Mono',monospace;font-size:0.56rem;
  color:var(--dim);margin-top:0.2rem;letter-spacing:0.04em;
}
.tl-conf span{color:var(--accent);opacity:0.7;}
.tl-conf{word-break:break-all;}
.bk-conf{word-break:break-all;}
.tl-detail{word-break:break-word;}

/* ══ PLACES VIEW ══ */
#placesView{padding:0;}
.places-top{
  background:var(--s1);border-bottom:1px solid var(--border);flex-shrink:0;
}
.places-cities{
  display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  padding:0 0.75rem;
}
.places-cities::-webkit-scrollbar{display:none;}
.pct{
  background:none;border:none;
  border-bottom:2px solid transparent;
  padding:0.7rem 0.75rem;
  font-family:'Outfit',sans-serif;font-size:0.7rem;font-weight:500;
  color:var(--muted);cursor:pointer;white-space:nowrap;flex-shrink:0;
  transition:all 0.15s;
}
.pct.active{color:var(--accent);border-bottom-color:var(--accent);}

.cat-bar{
  display:flex;gap:0.35rem;padding:0.5rem 0.75rem;
  border-bottom:1px solid var(--border);
  overflow-x:auto;scrollbar-width:none;
}
.cat-bar::-webkit-scrollbar{display:none;}
.cat-chip{
  background:var(--s2);border:1px solid var(--border);
  border-radius:20px;padding:0.25rem 0.65rem;
  font-size:0.66rem;color:var(--muted);cursor:pointer;
  white-space:nowrap;flex-shrink:0;transition:all 0.15s;
  font-family:'Outfit',sans-serif;
}
.cat-chip.active{background:var(--accent-glow);border-color:rgba(232,164,74,0.4);color:var(--accent);}

.ai-bar{
  margin:0.6rem 0.75rem 0;
  background:linear-gradient(135deg,rgba(232,164,74,0.07),rgba(109,184,138,0.05));
  border:1px solid rgba(232,164,74,0.18);
  border-radius:8px;padding:0.55rem 0.75rem;
  display:flex;align-items:center;justify-content:space-between;gap:0.5rem;
}
.ai-bar-text{font-size:0.72rem;color:var(--muted);}
.ai-bar-btn{
  background:var(--accent);color:#fff;border:none;
  border-radius:6px;padding:0.28rem 0.65rem;
  font-size:0.67rem;cursor:pointer;font-family:'Outfit',sans-serif;
  font-weight:500;white-space:nowrap;flex-shrink:0;
}

.places-list{padding:0.6rem 0.75rem 1.5rem;display:flex;flex-direction:column;gap:0.45rem;}

.place-card{
  background:var(--s2);border:1px solid var(--border);
  border-radius:10px;padding:0.75rem;
  transition:border-color 0.15s;
}
.place-card.is-saved{border-color:rgba(109,184,138,0.35);}
.place-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:0.5rem;}
.place-name{font-size:0.82rem;font-weight:600;color:var(--white);line-height:1.3;}
.pcat{
  font-family:'DM Mono',monospace;font-size:0.53rem;
  letter-spacing:0.07em;text-transform:uppercase;
  padding:0.18rem 0.4rem;border-radius:3px;flex-shrink:0;
}
.pcat.restaurant{background:rgba(109,184,138,0.12);color:var(--green);}
.pcat.coffee{background:rgba(232,164,74,0.12);color:var(--accent);}
.pcat.bar{background:rgba(160,125,212,0.12);color:var(--violet);}
.pcat.activity{background:rgba(122,175,212,0.12);color:var(--blue);}
.pcat.museum{background:rgba(122,175,212,0.12);color:var(--blue);}
.place-desc{font-size:0.73rem;color:var(--muted);margin-top:0.35rem;line-height:1.55;}
.place-footer{display:flex;gap:0.75rem;margin-top:0.35rem;flex-wrap:wrap;}
.place-area{font-size:0.66rem;color:var(--dim);}
.place-book{font-size:0.66rem;color:var(--red);opacity:0.8;}
.place-actions{display:flex;gap:0.4rem;margin-top:0.55rem;}
.pa-btn{
  background:none;border:1px solid var(--border);
  border-radius:6px;padding:0.28rem 0.6rem;
  font-size:0.66rem;color:var(--muted);cursor:pointer;
  font-family:'Outfit',sans-serif;transition:all 0.15s;
}
.pa-btn:hover{border-color:var(--accent);color:var(--accent);}
.pa-btn.saved{border-color:var(--green);color:var(--green);}
.place-note{
  margin-top:0.5rem;
  background:var(--s3);border:1px solid var(--border);
  border-radius:6px;padding:0.4rem 0.6rem;
  font-size:0.71rem;color:var(--text);
  font-family:'Outfit',sans-serif;resize:none;
  width:100%;min-height:46px;outline:none;
  transition:border-color 0.15s;
}
.place-note:focus{border-color:rgba(232,164,74,0.4);}
.place-note::placeholder{color:var(--dim);}

.add-btn{
  background:var(--s2);border:1px dashed var(--border);
  border-radius:10px;padding:0.75rem;text-align:center;
  cursor:pointer;font-size:0.75rem;color:var(--muted);
  transition:all 0.15s;width:100%;font-family:'Outfit',sans-serif;
}
.add-btn:hover{border-color:var(--accent);color:var(--accent);}

/* ══ ASK VIEW ══ */
#askView{flex-direction:column;padding:0;}

.ask-top{
  background:var(--s1);border-bottom:1px solid var(--border);flex-shrink:0;
}
.ask-cities{
  display:flex;overflow-x:auto;scrollbar-width:none;
  padding:0.5rem 0.75rem 0;-webkit-overflow-scrolling:touch;
}
.ask-cities::-webkit-scrollbar{display:none;}
.ask-city-btn{
  background:none;border:none;
  border-bottom:2px solid transparent;
  padding:0.55rem 0.7rem;
  font-family:'Outfit',sans-serif;font-size:0.7rem;font-weight:500;
  color:var(--muted);cursor:pointer;white-space:nowrap;flex-shrink:0;
  transition:all 0.15s;
}
.ask-city-btn.active{color:var(--accent);border-bottom-color:var(--accent);}

.ask-modes{
  display:flex;gap:0.4rem;padding:0.5rem 0.75rem;
}
.mode-btn{
  background:var(--s2);border:1px solid var(--border);
  border-radius:20px;padding:0.28rem 0.75rem;
  font-size:0.67rem;color:var(--muted);cursor:pointer;
  transition:all 0.15s;font-family:'Outfit',sans-serif;font-weight:500;
}
.mode-btn.active{background:var(--accent-glow);border-color:rgba(232,164,74,0.4);color:var(--accent);}

.quick-chips{
  display:flex;gap:0.35rem;padding:0.4rem 0.75rem 0.55rem;
  overflow-x:auto;scrollbar-width:none;
}
.quick-chips::-webkit-scrollbar{display:none;}
.qchip{
  background:var(--s2);border:1px solid var(--border);
  border-radius:20px;padding:0.26rem 0.65rem;
  font-size:0.66rem;color:var(--muted);cursor:pointer;
  white-space:nowrap;flex-shrink:0;transition:all 0.15s;
  font-family:'Outfit',sans-serif;
}
.qchip:hover{border-color:var(--accent);color:var(--accent);}

.context-strip{
  background:var(--s3);
  border-bottom:1px solid var(--border);
  padding:0.4rem 0.75rem;
  font-size:0.68rem;color:var(--muted);
  display:flex;align-items:center;gap:0.5rem;
  flex-shrink:0;
}
.context-strip .dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--accent);flex-shrink:0;opacity:0.7;
}

.chat-body{
  flex:1;overflow-y:auto;
  padding:0.75rem;
  display:flex;flex-direction:column;gap:0.7rem;
  -webkit-overflow-scrolling:touch;
}
.chat-body::-webkit-scrollbar{width:0;}

.empty-state{
  margin:auto;text-align:center;padding:1.5rem 1rem;
}
.empty-glyph{
  font-family:'Libre Baskerville',serif;
  font-size:3rem;color:var(--border);
  font-style:italic;line-height:1;margin-bottom:0.6rem;
}
.empty-text{font-size:0.78rem;color:var(--muted);line-height:1.7;max-width:230px;margin:0 auto;}

.msg{display:flex;gap:0.5rem;align-items:flex-start;}
.msg.user{flex-direction:row-reverse;}
.av{
  width:24px;height:24px;border-radius:50%;
  background:var(--s3);color:var(--muted);
  display:flex;align-items:center;justify-content:center;
  font-family:'DM Mono',monospace;font-size:0.5rem;
  flex-shrink:0;margin-top:2px;letter-spacing:0.04em;
}
.msg.user .av{background:var(--accent);color:#fff;}
.bub{
  max-width:85%;
  background:var(--s2);border:1px solid var(--border);
  border-radius:4px 10px 10px 10px;
  padding:0.65rem 0.8rem;
  font-size:0.79rem;line-height:1.7;color:var(--text);
}
.msg.user .bub{
  background:rgba(232,164,74,0.08);
  border-color:rgba(232,164,74,0.2);
  border-radius:10px 4px 10px 10px;
  color:var(--white);
}
.bub h3{
  font-family:'Libre Baskerville',serif;
  font-size:0.9rem;font-weight:700;
  color:var(--accent);margin:0.65rem 0 0.25rem;
}
.bub h3:first-child{margin-top:0;}
.bub ul,.bub ol{padding-left:1rem;margin:0.3rem 0;}
.bub li{margin-bottom:0.2rem;}
.bub p+p{margin-top:0.45rem;}
.bub strong{font-weight:600;color:var(--white);}
.bub em{font-style:italic;color:var(--accent);}
.book-flag{
  display:inline-flex;align-items:center;gap:0.25rem;
  background:rgba(212,122,122,0.1);border:1px solid rgba(212,122,122,0.25);
  color:#e09090;font-size:0.62rem;font-family:'DM Mono',monospace;
  letter-spacing:0.06em;padding:0.18rem 0.4rem;border-radius:3px;
  margin:0.15rem 0.1rem;text-transform:uppercase;
}

.typing-wrap{display:flex;gap:3px;align-items:center;padding:0.15rem 0;}
.typing-wrap span{
  width:4px;height:4px;background:var(--muted);border-radius:50%;
  animation:tp 1.2s infinite;
}
.typing-wrap span:nth-child(2){animation-delay:.2s;}
.typing-wrap span:nth-child(3){animation-delay:.4s;}
@keyframes tp{0%,80%,100%{transform:translateY(0);opacity:.3;}40%{transform:translateY(-4px);opacity:1;}}

.input-row{
  background:var(--s1);border-top:1px solid var(--border);
  padding:0.6rem 0.75rem;
  display:flex;gap:0.5rem;align-items:flex-end;flex-shrink:0;
}
.chat-ta{
  flex:1;background:var(--s2);border:1px solid var(--border);
  border-radius:8px;padding:0.55rem 0.75rem;
  font-family:'Outfit',sans-serif;font-size:0.81rem;color:var(--text);
  resize:none;min-height:38px;max-height:90px;line-height:1.5;
  outline:none;-webkit-appearance:none;transition:border-color 0.15s;
}
.chat-ta:focus{border-color:rgba(232,164,74,0.4);}
.chat-ta::placeholder{color:var(--dim);}
.chat-ta:disabled{opacity:0.4;}
.send-btn{
  background:var(--accent);color:#fff;border:none;
  border-radius:8px;width:38px;height:38px;
  cursor:pointer;font-size:1rem;flex-shrink:0;
  transition:background 0.15s;display:flex;align-items:center;justify-content:center;
}
.send-btn:hover{background:#d4903a;}
.send-btn:disabled{background:var(--s3);cursor:not-allowed;}

/* ══ BOOKINGS VIEW ══ */
#bookingsView{padding:0.75rem 0.75rem 1.5rem;flex-direction:column;gap:0;}

.bk-section-title{
  font-family:'DM Mono',monospace;font-size:0.57rem;
  letter-spacing:0.13em;color:var(--muted);text-transform:uppercase;
  padding:0.75rem 0.25rem 0.35rem;
}
.bk-card{
  background:var(--s2);border:1px solid var(--border);
  border-radius:10px;padding:0.7rem 0.85rem;margin-bottom:0.4rem;
}
.bk-top{display:flex;justify-content:space-between;align-items:flex-start;gap:0.5rem;}
.bk-name{font-size:0.8rem;font-weight:600;color:var(--white);}
.bk-tag{
  font-family:'DM Mono',monospace;font-size:0.53rem;
  letter-spacing:0.06em;text-transform:uppercase;
  padding:0.18rem 0.4rem;border-radius:3px;flex-shrink:0;
}
.bk-tag.hotel{background:rgba(122,175,212,0.12);color:var(--blue);}
.bk-tag.flight{background:rgba(232,164,74,0.12);color:var(--accent);}
.bk-tag.train{background:rgba(109,184,138,0.12);color:var(--green);}
.bk-tag.car{background:rgba(160,125,212,0.12);color:var(--violet);}
.bk-tag.ferry{background:rgba(122,175,212,0.12);color:var(--blue);}
.bk-detail{font-size:0.7rem;color:var(--muted);margin-top:0.25rem;line-height:1.6;}
.bk-conf{
  font-family:'DM Mono',monospace;font-size:0.62rem;
  color:var(--accent);margin-top:0.3rem;letter-spacing:0.05em;
}
.bk-conf-label{color:var(--dim);font-size:0.56rem;}
.bk-divider{height:1px;background:var(--border);margin:0.35rem 0 0.5rem;}

/* ── PRE-HOLIDAY BANNER ── */
.preholiday-banner{
  background:linear-gradient(135deg,rgba(232,164,74,0.1),rgba(109,184,138,0.07));
  border-bottom:1px solid rgba(232,164,74,0.2);
  padding:0.65rem 1rem;
  display:flex;align-items:center;justify-content:space-between;
  gap:0.75rem;flex-shrink:0;
}
.ph-left{}
.ph-label{
  font-family:'DM Mono',monospace;font-size:0.56rem;
  letter-spacing:0.13em;color:var(--accent);text-transform:uppercase;
  margin-bottom:0.2rem;
}
.ph-countdown{
  font-family:'Libre Baskerville',serif;

const MONTHS = ['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYS_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function fmtDate(str) {
  // str = 'YYYY-MM-DD'
  try {
    const d = new Date(str + 'T12:00:00');
    return DAYS_SHORT[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()+1];
  } catch(e) { return str; }
}

function fmtShort(str) {
  // e.g. '2026-06-23' -> '23 Jun'
  try {
    const parts = str.split('-');
    return parseInt(parts[2]) + ' ' + MONTHS[parseInt(parts[1])];
  } catch(e) { return str; }
}

function todayStr() {
  return new Date().toISOString().slice(0,10);
}

function buildTrip() {
  // city pills
  const sc = document.getElementById('cityScroller');
  sc.innerHTML = '';
  SEGS.forEach(seg => {
    const btn = document.createElement('button');
    btn.className = 'city-pill';
    btn.textContent = seg.flag + ' ' + seg.city.split(' ')[0];
    btn.dataset.segId = seg.id;
    btn.onclick = () => jumpToSeg(seg.id);
    sc.appendChild(btn);
  });

  // timeline
  const tl = document.getElementById('timeline');
  tl.innerHTML = '';
  const today = todayStr();

  SEGS.forEach(seg => {
    const block = document.createElement('div');
    block.className = 'seg-block';
    block.id = 'seg_' + seg.id;

    // segment banner
    const banner = document.createElement('div');
    banner.className = 'seg-banner';
    banner.innerHTML = `<div class="seg-banner-line"></div><div class="seg-banner-body"><div class="seg-city">${seg.flag} ${seg.city}</div><div class="seg-meta">${fmtShort(seg.start)} – ${fmtShort(seg.end)} · ${seg.nights}</div></div>`;
    block.appendChild(banner);

    // events for this seg grouped by date
    const evts = TL_EVENTS.filter(e => e.seg === seg.id);
    const byDate = {};
    evts.forEach(e => {
      if (!byDate[e.date]) byDate[e.date] = [];
      byDate[e.date].push(e);
    });

    const dates = Object.keys(byDate).sort();
    dates.forEach(date => {
      const isToday = date === today;
      const dayGroup = document.createElement('div');
      dayGroup.className = 'day-group';

      const dl = document.createElement('div');
      dl.className = 'day-label' + (isToday ? ' is-today' : '');
      dl.textContent = (isToday ? '▶ TODAY — ' : '') + fmtDate(date);
      dayGroup.appendChild(dl);

      const dayEvts = byDate[date];
      dayEvts.forEach((ev, i) => {
        const row = document.createElement('div');
        row.className = 'tl-row';
        row.onclick = () => { askSeg = seg; switchView('ask'); };
        const isLast = i === dayEvts.length - 1 && date === dates[dates.length-1];

        row.innerHTML = `
          <div class="tl-spine">
            <div class="tl-dot ${ev.type}${isToday?' is-today':''}"></div>
            ${!isLast ? '<div class="tl-line"></div>' : ''}
          </div>
          <div class="tl-card">
            ${ev.time ? `<div class="tl-time">${ev.time}</div>` : ''}
            <div class="tl-title">${ev.title}</div>
            <div class="tl-detail">${ev.detail}</div>
            ${ev.conf ? `<div class="tl-conf"><span>CONF </span>${ev.conf}</div>` : ''}
          </div>`;
        dayGroup.appendChild(row);
      });
      block.appendChild(dayGroup);
    });
    tl.appendChild(block);
  });
}

function jumpToSeg(segId) {
  document.querySelectorAll('.city-pill').forEach(b => {
    b.classList.toggle('active', b.dataset.segId === segId);
  });
  const el = document.getElementById('seg_' + segId);
  if (el && typeof el.scrollIntoView === 'function') el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function goToday() {
  const today = todayStr();
  const isOnTrip = today >= TRIP_START;

  // Auto-set ask mode
  if (isOnTrip) {
    askMode = 'trip';
    // Restore mode bar if it was hidden
    const modeBar = document.querySelector('.ask-modes');
    if (modeBar) modeBar.style.display = 'flex';
  }

  let match = SEGS[0];
  for (const seg of SEGS) {
    if (today >= seg.start && today <= seg.end) { match = seg; break; }
    if (today < seg.start) { match = seg; break; }
  }
  switchView('trip');
  setTimeout(() => jumpToSeg(match.id), 50);
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function fmtMd(text) {
  let h = text
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*\n]+?)\*/g, '<em>$1</em>')
    .replace(/^#{1,3}\s+(.+)$/gm, '<h3>$1</h3>')
    .replace(/\[BOOK NOW\]/gi, '<span class="book-flag">⚑ Book Now</span>')
    .replace(/\[ADVANCE BOOKING\]/gi, '<span class="book-flag">⚑ Book Ahead</span>');
  const lines = h.split('\n');
  let out = [], inUl = false;
  for (const ln of lines) {
    const li = ln.match(/^[-•]\s+(.+)/);
    if (li) {
      if (!inUl) { out.push('<ul>'); inUl = true; }
      out.push('<li>' + li[1] + '</li>');
    } else {
      if (inUl) { out.push('</ul>'); inUl = false; }
      if (ln.trim()) out.push('<p>' + ln + '</p>');
    }
  }
  if (inUl) out.push('</ul>');
  return out.join('');
}

async function sendMsg(text) {
  if (isLoading) return;
  const ta = document.getElementById('chatTa');
  const msg = (text || ta.value || '').trim();
  if (!msg) return;
  ta.value = '';
  ta.style.height = 'auto';

  const key = askSeg.id + '_' + askMode;
  if (!histories[key]) histories[key] = [];
  histories[key].push({ role: 'user', content: msg, html: '<p>' + esc(msg) + '</p>' });
  renderChat();
  showTyping();
  isLoading = true;
  document.getElementById('sendBtn').disabled = true;

  const sys = buildSysPrompt(askSeg, askMode);
  const hist = histories[key].slice(0, -1).map(m => ({ role: m.role, content: m.content }));

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: sys,
        tools: [{ type: 'web_search_20250305', name: 'web_search' }],
        messages: [...hist, { role: 'user', content: msg }]
      })
    });
    const data = await res.json();
    let reply = '';
    if (data.content && Array.isArray(data.content)) {
      for (const block of data.content) {
        if (block.type === 'text') reply += block.text;
      }
    }
    if (!reply) reply = 'No response received — please try again.';
    removeTyping();
    histories[key].push({ role: 'assistant', content: reply, html: fmtMd(reply) });
  } catch (e) {
    removeTyping();
    histories[key].push({ role: 'assistant', content: 'Connection error.', html: '<p>Connection error — please try again.</p>' });
  }

  isLoading = false;
  document.getElementById('sendBtn').disabled = false;
  renderChat();
}

// PRE-HOLIDAY MODE
// ══════════════════════════════════════════════
const TRIP_DEPART = '2026-06-22'; // Night of 22 Jun — wheels up from AKL
const TRIP_START  = '2026-06-23'; // First full day in London

function initPreHolidayMode() {
  const today = todayStr();
  const isPreHoliday = today < TRIP_START;

  if (isPreHoliday) {
    // Show countdown banner
    const banner = document.getElementById('preholidayBanner');
    if (banner) banner.style.display = 'flex';

    // Calculate days until departure
    const now = new Date();
    now.setHours(0,0,0,0);
    const depart = new Date(TRIP_DEPART + 'T00:00:00');
    const diffMs = depart - now;
    const diffDays = Math.ceil(diffMs / (1000 * 60 * 60 * 24));

    const phDays = document.getElementById('phDays');
    const phDate = document.getElementById('phDate');
    const phRight = document.getElementById('phRight');

    if (phDays) {
      if (diffDays > 1) {
        phDays.innerHTML = `<em>${diffDays}</em> days`;
        phDate.textContent = 'until wheels up from Auckland';
      } else if (diffDays === 1) {
        phDays.innerHTML = `<em>Tomorrow</em>`;
        phDate.textContent = 'you fly — MH132 departing 23:45 NZST';
      } else if (diffDays === 0) {
        phDays.innerHTML = `<em>Tonight</em>`;
        phDate.textContent = 'MH132 departs 23:45 NZST — pack!';
      }
    }

    if (phRight) {
      phRight.innerHTML = `<strong>Planning mode</strong>23 Jun — London<br>23 Jul — home`;
    }

    // Lock Ask tab to planning mode — no manual override needed, just default
    askMode = 'pre';

    // Hide the mode toggle bar — pre-trip it's always planning
    const modeBar = document.querySelector('.ask-modes');
    if (modeBar) modeBar.style.display = 'none';

    // Swap Today button text
    const todayBtn = document.querySelector('.today-btn');
    if (todayBtn) todayBtn.textContent = 'Plan ✦';

  } else {
    // On the trip — auto-detect mode based on which city we're in
    // If Today is pressed, set mode to 'trip' automatically
    askMode = 'trip';
  }
}

// ══════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════
buildTrip();
initPreHolidayMode();
renderAsk();
</script>
